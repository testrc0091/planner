<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#C97B8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bloom">
  <title>Bloom Planner</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="app">
    <!-- Main content area -->
    <div id="main-content"></div>

    <!-- Bottom tab bar -->
    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="today">
        <span class="tab-icon">☀️</span>
        Today
      </button>
      <button class="tab-btn" data-tab="weekly">
        <span class="tab-icon">🔄</span>
        Weekly
      </button>
      <button class="tab-btn" data-tab="monthly">
        <span class="tab-icon">📅</span>
        Monthly
      </button>
      <button class="tab-btn" data-tab="fitness">
        <span class="tab-icon">💪</span>
        Fitness
      </button>
      <button class="tab-btn" data-tab="calendar">
        <span class="tab-icon">🗓</span>
        Calendar
      </button>
      <button class="tab-btn" data-tab="settings">
        <span class="tab-icon">⚙️</span>
        Settings
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
